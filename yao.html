<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未经许可乱用烂手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 32px;
      letter-spacing: -0.3px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #dde1e9;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
      background: #fafbfc;
    }

    input:focus {
      border-color: #4f6ef7;
      background: #fff;
    }

    input::placeholder { color: #bbb; }

    input.invalid {
      border-color: #e03e3e !important;
      background: #fff8f8;
    }

    .hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    .error-msg {
      font-size: 12px;
      color: #e03e3e;
      margin-top: 5px;
      display: none;
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .time-btn {
      padding: 11px 8px;
      border: 1.5px solid #dde1e9;
      border-radius: 8px;
      background: #fafbfc;
      font-size: 15px;
      color: #1a1a2e;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.18s, background 0.18s, color 0.18s;
      user-select: none;
    }

    .time-btn:hover {
      border-color: #4f6ef7;
      background: #f0f3ff;
    }

    .time-btn.selected {
      border-color: #4f6ef7;
      background: #eef1ff;
      color: #4f6ef7;
      font-weight: 600;
    }

    .time-btn.invalid-sel {
      border-color: #e03e3e !important;
      background: #fff8f8;
    }

    button.submit {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.18s, transform 0.1s;
    }

    button.submit:hover { background: #3a57e8; }
    button.submit:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>瑶总专用</h1>

    <div class="field">
      <label for="name">名字</label>
      <input type="text" id="name" placeholder="如：YAN YUYAO" />
      <div class="hint">英文大写，格式：姓 名（中间一个空格）</div>
      <div class="error-msg" id="name-err">请输入正确格式，如：YAN YUYAO（全大写英文，姓 空格 名）</div>
    </div>

    <div class="field">
      <label for="number">票号</label>
      <input type="number" id="number" placeholder="10 ~ 50 的整数" min="10" max="50" step="1" />
      <div class="hint">整数，范围 10 ~ 50</div>
      <div class="error-msg" id="number-err">请输入 10 ~ 50 之间的整数</div>
    </div>

    <div class="field">
      <label>入场时间</label>
      <div class="time-grid">
        <div class="time-btn" data-alpha="A" onclick="selectTime(this)">10:00</div>
        <div class="time-btn" data-alpha="B" onclick="selectTime(this)">10:30</div>
        <div class="time-btn" data-alpha="C" onclick="selectTime(this)">11:00</div>
        <div class="time-btn" data-alpha="D" onclick="selectTime(this)">11:30</div>
      </div>
      <div class="error-msg" id="time-err">请选择入场时间</div>
    </div>

    <button class="submit" onclick="handleSubmit()">提交</button>
  </div>

  <script>
    let selectedAlpha = null;
    let selectedTimeEl = null;
    let selectedTimeVal = null;

    function selectTime(el) {
      if (selectedTimeEl) {
        selectedTimeEl.classList.remove('selected', 'invalid-sel');
      }
      el.classList.add('selected');
      el.classList.remove('invalid-sel');
      selectedTimeEl = el;
      selectedAlpha = el.dataset.alpha;
      selectedTimeVal = el.textContent.trim();
      document.getElementById('time-err').style.display = 'none';
    }

    function showError(inputId, errId, show) {
      const input = document.getElementById(inputId);
      const err   = document.getElementById(errId);
      if (show) {
        input.classList.add('invalid');
        err.style.display = 'block';
      } else {
        input.classList.remove('invalid');
        err.style.display = 'none';
      }
    }

    function handleSubmit() {
      const name   = document.getElementById('name').value.trim();
      const number = parseInt(document.getElementById('number').value, 10);

      let valid = true;

      // 名字：全大写英文，姓 空格 名
      const namePattern = /^[A-Z]+( [A-Z]+)+$/;
      if (!namePattern.test(name)) {
        showError('name', 'name-err', true);
        valid = false;
      } else {
        showError('name', 'name-err', false);
      }

      // 票号：整数，10 ~ 50
      const numRaw = document.getElementById('number').value.trim();
      if (!numRaw || isNaN(number) || !Number.isInteger(number) || number < 10 || number > 50) {
        showError('number', 'number-err', true);
        valid = false;
      } else {
        showError('number', 'number-err', false);
      }

      // 时间：必须选一个
      if (!selectedAlpha) {
        document.getElementById('time-err').style.display = 'block';
        document.querySelectorAll('.time-btn').forEach(b => b.classList.add('invalid-sel'));
        valid = false;
      }

      if (!valid) return;

      const params = new URLSearchParams({
        name,
        number,
        time: selectedTimeVal,
        alpha: selectedAlpha
      });
      window.location.href = `https://xzr139.github.io/my-page/tmp.html?${params.toString()}`;
    }
  </script>
</body>
</html>
