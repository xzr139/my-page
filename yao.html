<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.card {
  background: var(--color-background-primary);
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  padding: 40px 36px 36px;
  max-width: 420px;
  margin: 24px auto;
}
h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 28px; }
.field { margin-bottom: 18px; }
label { display: block; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
input[type="text"], input[type="number"] {
  width: 100%; padding: 10px 12px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  font-size: 15px; color: var(--color-text-primary);
  background: var(--color-background-secondary);
  outline: none;
}
input:focus { border-color: var(--color-border-info); background: var(--color-background-primary); }
input.invalid { border-color: var(--color-border-danger) !important; background: var(--color-background-danger); }
.hint { font-size: 12px; color: var(--color-text-tertiary); margin-top: 5px; }
.error-msg { font-size: 12px; color: var(--color-text-danger); margin-top: 5px; display: none; }
.time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.time-btn {
  padding: 10px 8px; border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md); background: var(--color-background-secondary);
  font-size: 14px; color: var(--color-text-primary); cursor: pointer;
  text-align: center; transition: all 0.15s; user-select: none;
}
.time-btn:hover { background: var(--color-background-tertiary); border-color: var(--color-border-primary); }
.time-btn.selected {
  background: var(--color-background-info);
  border-color: var(--color-border-info);
  color: var(--color-text-info);
  font-weight: 500;
}
.time-btn.invalid-sel { border-color: var(--color-border-danger); }
.submit-btn {
  width: 100%; margin-top: 12px; padding: 12px;
  background: var(--color-background-info);
  border: none; border-radius: var(--border-radius-md);
  font-size: 15px; font-weight: 500; color: var(--color-text-info);
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.submit-btn:hover { opacity: 0.85; }
.submit-btn:active { transform: scale(0.98); }
</style>

<div class="card">
  <h2 class="sr-only">瑶总专用表单</h2>
  <h1>未经许可乱用烂手</h1>

  <div class="field">
    <label for="name">名字</label>
    <input type="text" id="name" placeholder="如：YAN YUYAO" />
    <div class="hint">英文大写，格式：姓 名（中间一个空格）</div>
    <div class="error-msg" id="name-err">请输入正确格式，如：YAN YUYAO（全大写英文，姓 空格 名）</div>
  </div>

  <div class="field">
    <label for="number">票号</label>
    <input type="number" id="number" placeholder="10 ~ 50 的整数" min="10" max="50" step="1" />
    <div class="hint">整数，范围 10 ~ 50</div>
    <div class="error-msg" id="number-err">请输入 10 ~ 50 之间的整数</div>
  </div>

  <div class="field">
    <label>入场时间</label>
    <div class="time-grid" id="time-grid">
      <div class="time-btn" data-value="10:00" data-alpha="A" onclick="selectTime(this)">10:00</div>
      <div class="time-btn" data-value="10:30" data-alpha="B" onclick="selectTime(this)">10:30</div>
      <div class="time-btn" data-value="11:00" data-alpha="C" onclick="selectTime(this)">11:00</div>
      <div class="time-btn" data-value="11:30" data-alpha="D" onclick="selectTime(this)">11:30</div>
    </div>
    <div class="error-msg" id="time-err">请选择入场时间</div>
  </div>

  <button class="submit-btn" onclick="handleSubmit()">提交</button>
</div>

<script>
let selectedAlpha = null;
let selectedTimeEl = null;

function selectTime(el) {
  if (selectedTimeEl) selectedTimeEl.classList.remove('selected', 'invalid-sel');
  el.classList.add('selected');
  el.classList.remove('invalid-sel');
  selectedTimeEl = el;
  selectedAlpha = el.dataset.alpha;
  document.getElementById('time-err').style.display = 'none';
}

function showError(inputId, errId, show) {
  const input = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if (show) { if(input) input.classList.add('invalid'); err.style.display = 'block'; }
  else { if(input) input.classList.remove('invalid'); err.style.display = 'none'; }
}

function handleSubmit() {
  const name = document.getElementById('name').value.trim();
  const number = parseInt(document.getElementById('number').value, 10);
  let valid = true;

  const namePattern = /^[A-Z]+( [A-Z]+)+$/;
  showError('name', 'name-err', !namePattern.test(name));
  if (!namePattern.test(name)) valid = false;

  const numRaw = document.getElementById('number').value.trim();
  const numInvalid = !numRaw || isNaN(number) || !Number.isInteger(number) || number < 10 || number > 50;
  showError('number', 'number-err', numInvalid);
  if (numInvalid) valid = false;

  if (!selectedAlpha) {
    document.getElementById('time-err').style.display = 'block';
    document.querySelectorAll('.time-btn').forEach(b => b.classList.add('invalid-sel'));
    valid = false;
  }

  if (!valid) return;

  const timeVal = selectedTimeEl.dataset.value;
  const params = new URLSearchParams({ name, number, time: timeVal, alpha: selectedAlpha });
  window.location.href = `https://xzr139.github.io/my-page/tmp.html?${params.toString()}`;
}
</script>
